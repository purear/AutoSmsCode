name: Build APK

on:
  push:
    tags:
      - 'v*.*.*'  # Semantic version tag, e.g. v3.1.4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate Release Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate release notes and tag/version consistency
        run: |
          chmod +x scripts/check_release_guard.sh
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            scripts/check_release_guard.sh "${GITHUB_REF_NAME}"
          else
            scripts/check_release_guard.sh
          fi

  build-apk:
    name: Build APKs
    needs: [validate-release]
    runs-on: ubuntu-latest
    outputs:
      has_github_native_symbols: ${{ steps.github_symbols.outputs.exists }}
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > app/release.jks

      - name: Ensure Android 37 platform aliases
        shell: bash
        run: bash scripts/ensure_android_sdk_platform_alias.sh

      - name: Build APKs with Splits
        run: >
          ./gradlew
          assembleGithubApi101Release
          assembleGithubLegacyRelease
          -PbuildSplits
        env:
          KEYSTORE_FILE: release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: app/build/outputs/apk/**/release/*.apk
